<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- A tiny day grid: four days gone, today (red), four days left. -->
  <rect width="36" height="36" rx="3" fill="#141413"/>
  <g fill="#4a4a47">
    <rect x="6" y="6" width="6" height="6" rx="0.6"/>
    <rect x="15" y="6" width="6" height="6" rx="0.6"/>
    <rect x="24" y="6" width="6" height="6" rx="0.6"/>
    <rect x="6" y="15" width="6" height="6" rx="0.6"/>
  </g>
  <rect x="15" y="15" width="6" height="6" rx="0.6" fill="#ff6a55"/>
  <g fill="#ecece8">
    <rect x="24" y="15" width="6" height="6" rx="0.6"/>
    <rect x="6" y="24" width="6" height="6" rx="0.6"/>
    <rect x="15" y="24" width="6" height="6" rx="0.6"/>
    <rect x="24" y="24" width="6" height="6" rx="0.6"/>
  </g>
</svg>
