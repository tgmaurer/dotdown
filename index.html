<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Zooming is switched off on purpose (see also touch-action in style.css
       and the "No zoom" block in app.js). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Dwindle</title>
  <meta name="description" content="A countdown to one date. The whole thing lives in the link.">
  <link rel="canonical" href="https://tgmaurer.github.io/dwindle/">

  <!-- Link previews: the card chat apps and social sites show for a shared
       link. They fetch the page without the part after "#", so every
       countdown shares this same card and never its name or goals. The
       addresses must be absolute; update them if the site moves. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Dwindle">
  <meta property="og:title" content="Dwindle">
  <meta property="og:description" content="A countdown to one date. The whole thing lives in the link.">
  <meta property="og:url" content="https://tgmaurer.github.io/dwindle/">
  <meta property="og:image" content="https://tgmaurer.github.io/dwindle/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="180 days, in big numbers above a grid of day squares, some already gone.">
  <meta name="twitter:card" content="summary_large_image">

  <!-- The link holds the user's goals, so never send it anywhere as a referrer. -->
  <meta name="referrer" content="no-referrer">

  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">

  <!-- Home screen. Deliberately NO web app manifest: its start_url could
       replace the current URL and drop the state that lives in it. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dwindle">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Fetch the font early so the text does not visibly switch typeface. -->
  <link rel="preload" href="fonts/CommitMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <!-- The page background before style.css arrives, so the first frame is
       already the right colour in light and dark mode. No script needed:
       Dwindle follows the system setting. Keep in step with --bg in style.css. -->
  <style>
    html { background: #f5f5f2; }
    @media (prefers-color-scheme: dark) { html { background: #141413; } }
  </style>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <!-- Shown only while there is no countdown yet. -->
    <header id="intro" class="intro" hidden>
      <h1><img src="favicon.svg" alt="" width="24" height="24">Dwindle</h1>
      <p>Six months feels far. 180 days doesn’t. Name a date and watch it shrink.</p>
    </header>

    <p id="notice" class="notice" role="alert" hidden></p>

    <article id="view" hidden>
      <!-- A small brand line, and a way to start over without opening Edit. -->
      <div class="topbar">
        <span class="brand"><img src="favicon.svg" alt="" width="16" height="16">Dwindle</span>
        <button type="button" id="new-top" class="link">New countdown</button>
      </div>

      <h1 id="name" class="name"></h1>

      <!-- role="timer" is not announced on every change; keep it that way. -->
      <div id="ticker" class="ticker" role="timer" aria-live="off">
        <p class="days">
          <span id="t-days" class="num">0</span>
          <span class="days-line">
            <span id="t-days-label" class="unit">days</span>
            <span id="soon" class="soon" hidden>Time is almost up</span>
          </span>
        </p>
        <p class="clock">
          <span><span id="t-hours" class="num">00</span> <span class="unit">hours</span></span>
          <span><span id="t-minutes" class="num">00</span> <span class="unit">minutes</span></span>
          <span><span id="t-seconds" class="num">00</span> <span class="unit">seconds</span></span>
        </p>
      </div>
      <p id="passed" class="passed" hidden></p>
      <dl class="dates">
        <div><dt>from</dt><dd id="start"></dd></div>
        <div><dt id="target-label">until</dt><dd id="target"></dd></div>
      </dl>

      <section class="span" aria-label="How much time is gone">
        <div id="dots" class="dots" role="img"></div>
        <p class="caption"><strong id="percent"></strong> <span id="milestone"></span> <span id="scale"></span></p>
      </section>

      <section id="goals" class="goals" aria-labelledby="goals-title" hidden>
        <h2 id="goals-title" class="label">Goals</h2>
        <ul id="goal-list"></ul>
      </section>

      <div class="actions">
        <button type="button" id="edit-toggle" class="link" aria-expanded="false" aria-controls="editor">Edit</button>
        <button type="button" id="copy" class="link">Copy link</button>
        <!-- The corner links, folded away so the countdown fits on one screen.
             app.js copies them in from #corner, which is hidden here. -->
        <div class="more">
          <button type="button" id="more-toggle" class="link" aria-expanded="false" aria-controls="more-menu">More</button>
          <div id="more-menu" class="menu" hidden></div>
        </div>
      </div>
    </article>

    <!-- One form for both creating and editing. Validation runs in app.js. -->
    <form id="editor" class="editor" novalidate hidden>
      <div class="field">
        <label for="f-name" class="label">Name</label>
        <input id="f-name" name="countdown-name" type="text" maxlength="60" required autocomplete="off" placeholder="Trip to Japan">
      </div>
      <div class="field">
        <label for="f-date" class="label">Date</label>
        <input id="f-date" name="countdown-date" type="date" required max="9999-12-31" placeholder="YYYY-MM-DD">
      </div>
      <fieldset class="field">
        <legend class="label">Goals (optional)</legend>
        <ul id="f-goals"></ul>
        <button type="button" id="f-add" class="link">Add a goal</button>
      </fieldset>
      <p class="form-actions">
        <button type="submit" id="f-submit" class="primary">Start countdown</button>
        <button type="button" id="f-new" class="link" hidden>New countdown</button>
        <button type="button" id="f-back" class="link" hidden></button>
      </p>
    </form>

    <noscript><p class="notice">Dwindle needs JavaScript to count down.</p></noscript>
  </main>

  <!-- Quiet, non-blocking hint shown after an edit. -->
  <div id="hint" class="hint" hidden>
    <span id="hint-text" role="status"></span>
    <button type="button" id="hint-copy" class="link">Copy link</button>
    <button type="button" id="hint-close" class="link" aria-label="Dismiss">×</button>
  </div>

  <!--
    Reserved ad slot: empty, hidden, and with no scripts in v1.
    Any future ad MUST be isolated in a sandboxed <iframe>. A third-party
    script running in this page can read location.hash (and the query string),
    which would leak the user's countdown name and goals.
  -->
  <div id="ad" class="ad" hidden></div>

  <!-- Shown on the create page only; a countdown shows them under "More".
       Privacy opens in the same tab, so Back (or its "Back to Dwindle")
       returns to the countdown; that also avoids the separate browser sheet
       a new tab opens over a home screen app. It passes on only the site's
       address as referrer, so the privacy page can tell it came from here.
       GitHub links open in a new tab, so the countdown stays open. -->
  <aside id="corner" aria-label="More">
    <a href="privacy.html" referrerpolicy="origin">Privacy</a>
    <a href="https://github.com/tgmaurer/dwindle" target="_blank" rel="noopener noreferrer">Source</a>
    <a href="https://github.com/tgmaurer" target="_blank" rel="noopener noreferrer">More by me</a>
    <!-- Not live yet. Put the real address in place of #TODO, then uncomment:
    <a href="#TODO" target="_blank" rel="noopener noreferrer">Buy me a coffee</a>
    -->
  </aside>
</body>
</html>
